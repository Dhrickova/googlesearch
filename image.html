<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Google Image Search</title>
        <link rel="stylesheet" href="style.css?v=2de6857">
    </head>
    <body class="home-page">
        <header class="top-bar">
            <nav aria-label="Search options">
                <a href="index.html">Google Search</a>
                <a href="formular.html">Forms</a>
            </nav>
        </header>
        <main class="home-content">
            <h1 class="google-logo" aria-label="Google Images">
                <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
                <span class="images-label">Images</span>
            </h1>
            <form action="https://www.google.com/search" method="get" role="search">
                <label class="visually-hidden" for="image-query">Search Google Images</label>
                <input class="search-box" id="image-query" type="text" name="q" autocomplete="off" autofocus>
                <input type="hidden" name="tbm" value="isch">
                <div class="search-buttons">
                    <button type="submit">Image Search</button>
                </div>
            </form>
        </main>
        <footer class="site-footer">
            <nav aria-label="Project links">
                <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fdhrickova.github.io%2Fgooglesearch%2Fimage.html">Validate HTML</a>

                <a href="https://github.com/Dhrickova/googlesearch/blob/main/citace.md">Sources and citations</a>
                <a href="https://dhrickova.github.io/dalsiportfolio.html">Portfolio</a>
                <a href="https://dhrickova.github.io/index.html">Project1</a>
            </nav>
        </footer>
    </body>
</html>
